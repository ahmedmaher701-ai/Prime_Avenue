dding:5px 12px;border-radius:50px;font-size:12px;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat,.card,.tile{background:white;border:1px solid var(--line);border-radius:16px;padding:20px}.stat span,.sub{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:27px;margin-top:4px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:28px 0 13px}.section-head h2{font-size:19px;margin:0}.two{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}.item{padding:16px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.item h3{margin:4px 0;font-size:15px}.item p{margin:5px 0;color:#617478}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.tag{display:inline-block;background:#edf3f1;color:#36735f;border-radius:7px;padding:3px 9px;font-size:11px;font-weight:700}.tag.wait{background:#fff4e4;color:#a16b22}.tag.done{background:#e7f6ec;color:#237847}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.tile{cursor:pointer;text-align:center;transition:.2s}.tile:hover{transform:translateY(-3px);border-color:var(--gold)}.tile .icon{font-size:26px;display:block;margin-bottom:7px}.tile strong{display:block}.page-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.page-title h1{font-size:24px;margin:0}.page-title p{margin:3px 0;color:var(--muted)}.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.filter{border:1px solid var(--line);background:white;border-radius:25px;padding:7px 13px;color:var(--muted)}.filter.active{background:var(--ink);color:white}.list{display:grid;gap:12px}.post{background:white;border:1px solid var(--line);border-radius:16px;padding:19px}.post h3{margin:7px 0;font-size:17px}.post p{margin:8px 0;white-space:pre-wrap}.post .meta{font-size:12px;color:var(--muted)}.post img{max-width:100%;max-height:240px;object-fit:cover;border-radius:12px;margin:10px 0}.post .foot{display:flex;align-items:center;gap:12px;margin-top:13px}.textbtn{border:0;background:none;color:#4c7476;font-weight:700;padding:3px}.categories{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.category{background:white;border:1px solid var(--line);border-radius:14px;padding:17px;cursor:pointer}.category strong{display:block;margin-top:8px}.category span{font-size:24px}.search{width:100%;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:white;margin-bottom:14px}.notice{background:#fff9eb;border:1px solid #f2e6c7;color:#81672c;padding:15px;border-radius:13px;margin:15px 0}.empty{text-align:center;padding:35px;background:white;border:1px dashed #cdd9d5;border-radius:16px;color:var(--muted)}.modal-bg{position:fixed;inset:0;background:#0b1b20aa;display:none;align-items:center;justify-content:center;z-index:20;padding:15px}.modal-bg.show{display:flex}.modal{background:white;border-radius:20px;padding:25px;width:min(520px,100%);max-height:90vh;overflow:auto}.modal h2{margin:0 0 14px}.field{display:block;margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid #d9e2de;border-radius:10px;padding:11px;background:#fff;color:var(--ink)}.field textarea{min-height:90px;resize:vertical}.modal-footer{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}.bottom-nav{display:none}.soon{padding:40px;text-align:center;background:linear-gradient(110deg,#f5ecda,#fff);border-radius:17px}.soon h2{margin:6px}.mini{font-size:12px;color:var(--muted)}.comment{background:#f5f7f5;padding:10px 12px;border-radius:9px;margin-top:8px}.badge{background:#e9eee9;border-radius:7px;padding:3px 8px;font-size:11px}.profilebox{max-width:650px}.adminhint{color:#a56b2d;font-size:12px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:750px){.desktop-nav{display:none}.top{padding:7px 13px}.brand img{width:41px;height:41px}.brand strong{font-size:1 .brand img{object-fit:contain;background:#f3f1e9;padding:5px;border:1px solid #ece9df}.hero .mark{width:155px;height:155px;flex-shrink:0;object-fit:contain;background:#ffffff14;border:1px solid #ffffff28;border-radius:24px;padding:14px;opacity:1}.hero{background:radial-gradient(circle at 80% 35%,#375b5d,#172e37 70%)}.quick .tile .icon{font-size:30px}.auth-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 18px}.auth-tabs .btn{font-size:12px;padding:9px 11px}.admin-entry{margin-top:18px}.admin-grid{margin-top:22px;align-items:start}.admin-grid>.card{min-width:0}.admin-grid .item select{background:#f8faf8;border:1px solid #dbe1de;border-radius:8px;padding:9px;width:100%}.admin-grid .btn{padding:7px 12px;font-size:12px;margin:5px 2px}.demo-notice{font-size:12px;line-height:1.8}.admin-stats{margin-top:18px}.bottom-nav button{min-width:0;flex:1}@media(max-width:750px){.hero .mark{width:94px;height:94px;padding:9px;border-radius:17px}.admin-grid{grid-template-columns:1fr}.hero{gap:8px}.admin-entry{margin-top:14px}}</style></head><body><header><div class="top"><div class="brand"><img src="prime-avenue-logo.svg" alt="Prime Avenue"><div><strong>PRIME AVENUE</strong><small data-i="brandSub">مجتمع السكان • حدائق أكتوبر</small></div></div><div class="top-actions"><button class="btn light" id="langBtn" onclick="toggleLang()">English</button><button class="btn" id="accountBtn" onclick="openAccount()">دخول السكان</button></div></div><nav class="desktop-nav" id="desktopNav"></nav></header><main id="app"></main><nav class="bottom-nav" id="bottomNav"></nav><div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()"><div class="modal" id="modalBody"></div></div><script>
const ar={home:'الرئيسية',issues:'البلاغات',forum:'المنتدى',ideas:'الأفكار',services:'دليل الخدمات',events:'الفعاليات',profile:'حسابي',welcome:'أهلاً بيكم في برايم أفينيو',heroText:'مكان واحد يجمع جيراننا، نتابع فيه البلاغات ونتشارك الأفكار والأخبار.',report:'بلّغ عن مشكلة',newPost:'افتح موضوع',newIdea:'اقترح فكرة',addService:'رشّح مكان أو فني',latestIssues:'آخر البلاغات',latestPosts:'نقاشات الجيران',all:'عرض الكل',open:'جديد',progress:'جاري المتابعة',resolved:'تم الحل',issueSubtitle:'بلّغ وتابع المشاكل اللي بتخص الكمبوند',forumSubtitle:'نتكلم ونتناقش مع بعض بكل احترام',ideasSubtitle:'اقتراحات لتحسين حياتنا وأنشطة للأطفال والجيران',servicesSubtitle:'مطاعم وكافيهات وفنيين وخدمات قريبة مننا',eventsSubtitle:'التجمعات والأنشطة الجاية في الكمبوند',coming:'قريباً',discounts:'خصومات خاصة لسكان برايم أفينيو',login:'دخول السكان',logout:'تسجيل خروج',account:'حسابي',save:'حفظ',cancel:'إلغاء',submit:'نشر',comments:'التعليقات',support:'أنا كمان عندي المشكلة',vote:'صوّت للفكرة',name:'الاسم',phone:'رقم الموبايل',building:'رقم العمارة',unit:'رقم الوحدة',residentType:'صفة الإقامة',owner:'مالك',tenant:'مستأجر',title:'العنوان',description:'التفاصيل',category:'التصنيف',image:'صورة (اختياري)',search:'دوّر على خدمة أو مكان...',pending:'في انتظار الموافقة',join:'سجّل بياناتك عشان تشارك مع جيرانك',approved:'عضو معتمد',addEvent:'إضافة فعالية',directory:'دليل الخدمات',admin:'إدارة المحتوى'};
const en={home:'Home',issues:'Issues',forum:'Forum',ideas:'Ideas',services:'Services',events:'Events',profile:'Profile',welcome:'Welcome to Prime Avenue',heroText:'One place for neighbors to report issues, share ideas and stay connected.',report:'Report an issue',newPost:'Start a discussion',newIdea:'Suggest an idea',addService:'Recommend a service',latestIssues:'Latest issues',latestPosts:'Neighborhood discussions',all:'View all',open:'New',progress:'In progress',resolved:'Resolved',issueSubtitle:'Report and track community issues',forumSubtitle:'Connect with your neighbors',ideasSubtitle:'Ideas to improve our community and organize activities',servicesSubtitle:'Nearby restaurants, cafés, technicians and services',eventsSubtitle:'Upcoming community gatherings and activities',coming:'Coming soon',discounts:'Exclusive Prime Avenue resident offers',login:'Resident sign in',logout:'Sign out',account:'My profile',save:'Save',cancel:'Cancel',submit:'Publish',comments:'Comments',support:'I have this issue too',vote:'Vote for this idea',name:'Name',phone:'Mobile number',building:'Building number',unit:'Unit number',residentType:'Resident type',owner:'Owner',tenant:'Tenant',title:'Title',description:'Details',category:'Category',image:'Photo (optional)',search:'Search services...',pending:'Awaiting approval',join:'Register to participate',approved:'Approved resident',addEvent:'Add event',directory:'Service directory',admin:'Manage content'};
const icons={home:'🏠',issues:'🛠️',forum:'💬',ideas:'💡',services:'📍',events:'📅',profile:'👤'};const categories=[['🍽️','مطاعم','Restaurants'],['☕','كافيهات','Cafés'],['🛒','سوبر ماركت','Supermarkets'],['💊','صيدليات','Pharmacies'],['🏥','مستشفيات وعيادات','Clinics & hospitals'],['🔧','سباكين','Plumbers'],['⚡','كهربائية','Electricians'],['❄️','صيانة أجهزة وتكييف','AC & appliances'],['🚗','ميكانيكية','Car mechanics'],['🛞','كاوتش وبطاريات','Tires & batteries'],['🧹','نظافة','Cleaning'],['📶','إنترنت','Internet technicians'],['🏫','حضانات ومدارس','Schools & nurseries'],['🚚','توصيل','Delivery'],['🚨','طوارئ','Emergency'],['🧰','خدمات أخرى','Other services']];
const storageKey='prime-avenue-demo-v1';let state=JSON.parse(localStorage.getItem(storageKey)||'null')||{user:null,issues:[],forum:[],ideas:[],services:[],events:[],comments:[]};let lang=localStorage.getItem('pa-lang')||'ar',page='home',filter='all',serviceCat=-1,searchText='';const t=k=>(lang==='ar'?ar:en)[k]||k;const tr=(a,b)=>lang==='ar'?a:b;const save=()=>localStorage.setItem(storageKey,JSON.stringify(state));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=s=>new Date(s).toLocaleDateString(lang==='ar'?'ar-EG':'en-GB');const count=k=>state[k].filter(x=>x.status!=='pending').length;const user=()=>state.user;const isAdmin=()=>false; // Demo intentionally has no privileged client-side admin bypass.
function nav(p){page=p;filter='all';serviceCat=-1;render();window.scrollTo(0,0)}function toggleLang(){lang=lang==='ar'?'en':'ar';localStorage.setItem('pa-lang',lang);render()}function closeModal(){document.getElementById('modal').classList.remove('show')}function modal(html){document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.add('show')}
function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.getElementById('langBtn').textContent=lang==='ar'?'English':'عربي';document.getElementById('accountBtn').textContent=user()?esc(user().name):t('login');const keys=['home','issues','forum','ideas','services','events','profile'];document.getElementById('desktopNav').innerHTML=keys.map(k=>`<button class="navbtn ${page===k?'active':''}" onclick="nav('${k}')">${t(k)}</button>`).join('');document.getElementById('bottomNav').innerHTML=['home','issues','forum','ideas','profile'].map(k=>`<button class="${page===k?'active':''}" onclick="nav('${k}')"><span>${icons[k]}</span>${t(k)}</button>`).join('');document.querySelector('[data-i="brandSub"]').textContent=tr('مجتمع السكان • حدائق أكتوبر','Residents community • Hadayek October');document.getElementById('app').innerHTML=({home:homePage,issues:()=>feed('issues'),forum:()=>feed('forum'),ideas:()=>feed('ideas'),services:servicesPage,events:eventsPage,profile:profilePage})[page]();}
function header(title,sub,button,action){return `<div class="page-title"><div><h1>${title}</h1><p>${sub}</p></div>${button?`<button class="btn gold" onclick="${action}">${button}</button>`:''}</div>`}function empty(msg){return `<div class="empty">${msg}</div>`}function item(x,type){let labels={issues:t('support'),ideas:t('vote'),forum:t('comments')};let num=x.votes?.length||0;return `<article class="post"><div class="row"><span class="meta">${esc(x.author)} · ${date(x.created)}</span>${type==='issues'?`<span class="tag ${x.issueStatus==='resolved'?'done':x.issueStatus==='progress'?'wait':''}">${t(x.issueStatus||'open')}</span>`:''}</div><h3>${esc(x.title)}</h3><p>${esc(x.description)}</p>${x.image?`<img src="${x.image}" alt="${t('image')}">`:''}<div class="foot"><button class="textbtn" onclick="vote('${type}','${x.id}')">${labels[type]} ${type!=='forum'?`(${num})`:''}</button><button class="textbtn" onclick="showComments('${type}','${x.id}')">💬 ${t('comments')} (${state.comments.filter(c=>c.parent===x.id).length})</button>${x.status==='pending'?`<span class="badge">${t('pending')}</span>`:''}</div></article>`}
function visible(k){return state[k].filter(x=>x.status==='approved'||x.authorPhone===user()?.phone)}function feed(k){let titles={issues:t('issues'),forum:t('forum'),ideas:t('ideas')},subs={issues:t('issueSubtitle'),forum:t('forumSubtitle'),ideas:t('ideasSubtitle')},actions={issues:t('report'),forum:t('newPost'),ideas:t('newIdea')};let items=visible(k).filter(x=>filter==='all'||(k==='issues'&&x.issueStatus===filter));return header(titles[k],subs[k],actions[k],`newEntry('${k}')`)+(k==='issues'?`<div class="filters">${['all','open','progress','resolved'].map(f=>`<button class="filter ${filter===f?'active':''}" onclick="filter='${f}';render()">${f==='all'?t('all'):t(f)}</button>`).join('')}</div>`:'')+`<div class="list">${items.length?items.sort((a,b)=>b.created.localeCompare(a.created)).map(x=>item(x,k)).join(''):empty(tr('لسه مفيش مشاركات هنا. خليك أول واحد!','No posts yet. Be the first!'))}</div>`}
function homePage(){return `<section class="hero"><div><span class="pill">PRIME AVENUE COMMUNITY</span><h1>${t('welcome')}</h1><p>${t('heroText')}</p><button class="btn gold" onclick="newEntry('issues')">${t('report')} ←</button></div><img class="mark" src="prime-avenue-logo.svg" alt="Prime Avenue"></section><div class="section-head"><h2>${tr('المجتمع في أرقام','Community at a glance')}</h2></div><div class="grid">${[[count('issues'),tr('بلاغات','Issues')],[count('forum'),tr('مناقشات','Discussions')],[count('ideas'),tr('أفكار','Ideas')],[count('services'),tr('خدمات','Services')]].map(x=>`<div class="stat"><span>${x[1]}</span><strong>${x[0]}</strong></div>`).join('')}</div><div class="section-head"><h2>${tr('تعمل إيه النهارده؟','What would you like to do?')}</h2></div><div class="quick">${[['🛠️',t('report'),"newEntry('issues')"],['💬',t('newPost'),"newEntry('forum')"],['💡',t('newIdea'),"newEntry('ideas')"],['📍',t('services'),"nav('services')"]].map(x=>`<div class="tile" onclick="${x[2]}"><span class="icon">${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}</div><div class="two"><div><div class="section-head"><h2>${t('latestIssues')}</h2><button class="textbtn" onclick="nav('issues')">${t('all')}</button></div>${visible('issues').length?visible('issues').slice(-3).reverse().map(x=>item(x,'issues')).join(''):empty(tr('لسه مفيش بلاغات','No issues reported yet'))}</div><div><div class="section-head"><h2>${t('latestPosts')}</h2><button class="textbtn" onclick="nav('forum')">${t('all')}</button></div>${visible('forum').length?visible('forum').slice(-3).reverse().map(x=>item(x,'forum')).join(''):empty(tr('ابدأ أول نقاش مع جيرانك','Start the first discussion'))}<div class="notice">${tr('🎉 عروض خاصة لسكان برايم أفينيو — قريباً','🎉 Exclusive resident discounts — coming soon')}</div></div></div>`}
function servicesPage(){let items=visible('services').filter(x=>(serviceCat===-1||x.category===serviceCat)&&(`${x.name} ${x.description} ${x.address}`).toLowerCase().includes(searchText.toLowerCase()));return header(t('services'),t('servicesSubtitle'),t('addService'),'newEntry(\'services\')')+`<input class="search" placeholder="${t('search')}" value="${esc(searchText)}" oninput="searchText=this.value;document.getElementById('serviceResults').innerHTML=serviceItems()"><div class="categories">${categories.map((c,i)=>`<div class="category" style="${serviceCat===i?'border-color:#b99a65;background:#fffaf0':''}" onclick="serviceCat=${serviceCat===i?-1:i};render()"><span>${c[0]}</span><strong>${tr(c[1],c[2])}</strong></div>`).join('')}</div><div class="section-head"><h2>${tr('ترشيحات الجيران','Neighbor recommendations')}</h2></div><div id="serviceResults">${serviceItems()}</div><div class="section-head"><h2>${t('discounts')}</h2></div><div class="soon"><h2>${t('coming')}</h2><p>${tr('استنوا عروض وخصومات مخصوص لسكان برايم أفينيو','Special offers for Prime Avenue residents are on the way')}</p></div>`}function serviceItems(){let items=visible('services').filter(x=>(serviceCat===-1||x.category===serviceCat)&&(`${x.name} ${x.description} ${x.address}`).toLowerCase().includes(searchText.toLowerCase()));return items.length?`<div class="list">${items.map(x=>`<div class="post"><div class="row"><h3>${esc(x.name)}</h3><span class="tag">${tr(categories[x.category]?.[1],categories[x.category]?.[2])}</span></div><p>${esc(x.description)}</p><p class="mini">📍 ${esc(x.address)}</p><p class="mini">${tr('رشحه','Recommended by')} ${esc(x.author)}</p>${x.phone?`<a class="btn" style="display:inline-block;text-decoration:none" href="tel:${encodeURIComponent(x.phone)}">☎ ${esc(x.phone)}</a>`:''}</div>`).join('')}</div>`:empty(tr('لسه بنجمع الأماكن والخدمات القريبة. رشّح مكان بتحبه!','We are collecting nearby recommendations. Suggest your favorite!'))}
function eventsPage(){return header(t('events'),t('eventsSubtitle'))+`<div class="soon"><h2>📅 ${t('coming')}</h2><p>${tr('فعاليات للأطفال، تجمعات للجيران، وأنشطة مختلفة هنعلن عنها هنا','Kids’ activities, neighbor gatherings and community events will appear here')}</p></div>${visible('events').map(x=>`<div class="post"><h3>${esc(x.title)}</h3><p>${esc(x.description)}</p><span class="meta">${esc(x.eventDate||'')}</span></div>`).join('')}`}
function profilePage(){if(!user())return `<div class="card profilebox">${header(t('profile'),t('join'))}<button class="btn gold" onclick="openAccount()">${t('login')}</button></div>`;return `<div class="card profilebox">${header(t('profile'),tr('بيانات العضوية','Membership details'))}<h2>${esc(user().name)}</h2><p>☎ ${esc(user().phone)}</p><p>${t('building')}: ${esc(user().building)} · ${t('unit')}: ${esc(user().unit)}</p><p>${t('residentType')}: ${user().type==='owner'?t('owner'):t('tenant')}</p><span class="tag wait">${tr('حساب تجريبي على الجهاز','Local demo account')}</span><div class="notice">${tr('دي نسخة تجريبية. البيانات محفوظة على جهازك فقط، ومش ظاهرة للجيران. تشغيل العضويات الحقيقية محتاج ربط قاعدة بيانات وتفعيل التحقق والموافقة.','This is a local demo. Data is stored only on this device. Real resident accounts require a database, secure authentication and approval.')}</div><button class="btn light" onclick="state.user=null;save();render()">${t('logout')}</button></div>`}
function openAccount(){if(user()){nav('profile');return}modal(`<h2>${t('login')}</h2><p class="sub">${t('join')}</p><form onsubmit="register(event)"><div class="field"><label>${t('name')}</label><input name="name" required maxlength="80"></div><div class="field"><label>${t('phone')}</label><input name="phone" type="tel" required pattern="[0-9+ ]{10,16}" placeholder="01xxxxxxxxx"></div><div class="split"><div class="field"><label>${t('building')}</label><input name="building" required maxlength="20"></div><div class="field"><label>${t('unit')}</label><input name="unit" required maxlength="20"></div></div><div class="field"><label>${t('residentType')}</label><select name="type"><option value="owner">${t('owner')}</option><option value="tenant">${t('tenant')}</option></select></div><p class="adminhint">${tr('تجربة فقط: رقم الموبايل هنا مش بيتحقق منه، ومش تسجيل دخول آمن.','Demo only: phone numbers are not verified and this is not secure authentication.')}</p><div class="modal-footer"><button type="button" class="btn light" onclick="closeModal()">${t('cancel')}</button><button class="btn gold">${t('save')}</button></div></form>`)}function register(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));state.user=d;save();closeModal();render()}
function newEntry(k){if(!user()){openAccount();return}let titles={issues:t('report'),forum:t('newPost'),ideas:t('newIdea'),services:t('addService')};let fields=k==='services'?`<div class="field"><label>${tr('اسم المكان أو الفني','Business / technician name')}</label><input name="name" required maxlength="100"></div><div class="field"><label>${t('category')}</label><select name="category">${categories.map((c,i)=>`<option value="${i}">${tr(c[1],c[2])}</option>`).join('')}</select></div><div class="field"><label>${t('phone')}</label><input name="phone" type="tel" maxlength="20" required></div><div class="field"><label>${tr('العنوان أو المنطقة','Address / area')}</label><input name="address" required maxlength="180"></div>`:`<div class="field"><label>${t('title')}</label><input name="title" required maxlength="120"></div>${k==='issues'?`<div class="field"><label>${t('category')}</label><select name="category"><option>صيانة</option><option>نظافة</option><option>أمن</option><option>جراج</option><option>إضاءة</option><option>زراعة</option><option>أخرى</option></select></div>`:''}`;modal(`<h2>${titles[k]}</h2><form onsubmit="submitEntry(event,'${k}')">${fields}<div class="field"><label>${t('description')}</label><textarea name="description" required maxlength="2000"></textarea></div>${k==='issues'?`<div class="field"><label>${t('image')}</label><input name="image" type="file" accept="image/png,image/jpeg,image/webp"></div>`:''}<div class="modal-footer"><button type="button" class="btn light" onclick="closeModal()">${t('cancel')}</button><button class="btn gold">${t('submit')}</button></div></form></div>`)}
async function submitEntry(e,k){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));if(k==='issues'&&d.image?.size){if(d.image.size>650000){alert(tr('اختار صورة أقل من 650 كيلوبايت للنسخة التجريبية','Choose an image under 650 KB for this demo'));return}d.image=await new Promise((res,rej)=>{let r=new FileReader;r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(d.image)})}else d.image='';d.id=String(Date.now());d.created=new Date().toISOString();d.author=user().name;d.authorPhone=user().phone;d.votes=[];d.status=k==='services'?'pending':'approved';if(k==='issues')d.issueStatus='open';if(k==='services')d.category=Number(d.category);state[k].push(d);try{save()}catch(err){state[k].pop();alert(tr('مساحة التخزين على الجهاز مش كفاية','Device storage is full'));return}closeModal();nav(k)}function vote(k,id){if(!user()){openAccount();return}if(k==='forum'){showComments(k,id);return}let x=state[k].find(x=>x.id===id);if(!x)return;let i=x.votes.indexOf(user().phone);i<0?x.votes.push(user().phone):x.votes.splice(i,1);save();render()}
function showComments(k,id){let x=state[k].find(x=>x.id===id);if(!x)return;let comments=state.comments.filter(c=>c.parent===id);modal(`<h2>${esc(x.title)}</h2><div>${comments.length?comments.map(c=>`<div class="comment"><strong>${esc(c.author)}</strong><p>${esc(c.body)}</p></div>`).join(''):empty(tr('لسه مفيش تعليقات','No comments yet'))}</div>${user()?`<form onsubmit="addComment(event,'${id}','${k}')"><div class="field"><textarea name="body" required maxlength="800" placeholder="${t('comments')}"></textarea></div><button class="btn gold">${t('submit')}</button></form>`:`<button class="btn" onclick="openAccount()">${t('login')}</button>`}`)}function addComment(e,id,k){e.preventDefault();state.comments.push({parent:id,body:e.target.body.value,author:user().name,created:new Date().toISOString()});save();showComments(k,id);render()}
render();
</script><script src="upgrade.js"></script></body></html>
